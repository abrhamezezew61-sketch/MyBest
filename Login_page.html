<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login_page</title>
<head>
    <style>
        body {
            background: radial-gradient(circle,rgb(9, 20, 9),rgb(14, 14, 26));
        }

        .profile-icon-card {
            height: 50px;
            width: 190px;
            border-radius: 40%;
            background:transparent;
            margin-top: -120px;
            cursor: pointer;
            border-style: groove;
            border-color: rgb(17, 37, 37);
            display: flex;
            justify-content: center;
        }

        .profile-icon {
            width: 102px;
            height: 98px;
            border-radius: 25px;
            font-size: 60px;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .stnadeji {
            display: flex;
            justify-content: center;

        }

        /*.profile-icon-card:hover {
            transform: translatex(-4px);
            box-shadow: 5px 4px 80px rgb(253, 172, 242);
        }*/

        .name {
            text-shadow: aqua;
            text-decoration: wavy;
            font-size: 17px;
            font-family: 'Fraunces', serif;
            background: radial-gradient(circle, rgb(241, 167, 235), rgb(190, 240, 186));
            margin: 5px;
            width: 250px;
            height: 40px;
            border-style: groove;
            border-color: aqua;
            border-radius: 50px;
        }

        .card-number {
            margin-top: 80px;
            justify-content: center;
        }

        .name:hover {
            transform: translateY(-1px);
            box-shadow: 5px 20px 70px aqua;
        }

        .carding {
            width: 340px;
            height: 400px;
            border-radius: 100px;
            display: flex;
            justify-content: center;
            background:rgb(11, 20, 11);
        }

        .carding:hover {
            transform: translateY(4px);
            box-shadow: 0 12px 40px aqua;
        }

        .car {
            margin-top: 250px;
            align-items: center;
            display: flex;
            justify-content: center;
        }

        .login-button {
            height: 35px;
            width: 80px;
            background: rgb(202, 253, 253);
            justify-content: center;
            align-items: center;
            display: flex;
            border-radius: 20px;
            cursor: pointer;
            border-style: solid;
            border-color: aqua;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 40px rgb(231, 151, 211);
        }

        .names {
            color: aqua;
            margin-left: 20px;
        }

        .thinge {
            margin-top: 20px;
            justify-content: center;
            align-items: center;
            display: flex;
            
        }

        .forget {
            margin-top: 20px;
            margin-right: 20px;
            display: flex;
            justify-content: end;
            text-align: center
        }

        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
        }

        .tsehay {
            position: relative;
        }

        .error-msg {
            background: #FFF0EE;
            border: 1px solid #F5C6C2;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 20px;
            color: red;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-msg.show {
            display: flex;
        }
    </style>
</head>

<body>
    <form class="car">
        <div class="carding">
            <div class="card-number">
               
                <div class="stnadeji">
                    <div class="profile-icon-card">
                        <span style="font-size: xx-large;font-family:'Fraunces', serif;color:rgb(253, 172, 242)" id="well" onclick="welling"><i>
                                Wellcome🖐</i></span>
                    </div>
                </div>
                <label class="names" id="usernameing" autocorrect="on"
                    aria-autocomplete="both">username/email</label><br>
                <input type="text" placeholder="abrsh2189" class="name"><br>
                <label class="names">password</label><br>
                <div class="tsehay">

                    <input type="text" placeholder="**********" autocomplete="current-password" class="name"
                        id="password" oninput="checkStrength(this.value)">
                    <button type="button" class="eye-btn" onclick="togglePassword()" id="eyeBtn">👁️</button><br>
                </div>
                <div class="thinge">
                    <button class="login-button">login</button>
                </div>
                <div class="forget">
                    <a href="calcula.html" style="color: aqua;">forget password?</a>
                </div>
            </div>
        </div>
    </form>
    <script>
        let isLogin = true;
        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.getElementById('eyeBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = "🙈";
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }
        function showError(msg) {
            const c1 = document.getElementById('errorMsg');
            document.getElementById('errorText').textContent = msg;
            e1.classList.add('show');
        }
        function hideError() {
            document.getElementById('errorMsg').classList.add('show')
        }
        
    </script>
</body>

</html>
